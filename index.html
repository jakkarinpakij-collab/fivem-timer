<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนที่กองปูน + นับเวลา</title>
<style>
:root{--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e3e1da;--idle:#1a7f4b;--run:#1d4ed8;--done:#b42318;--pri:#2563eb;--warn:#e8710a;--hd:#e8f0ff;--donebg:#fef2f1;--inbg:#fff;--xbg:#1f2328;--xfg:#fff}
:root[data-theme=dark]{--card:#1f2228;--ink:#eceef1;--mut:#9aa1ad;--line:#343944;--idle:#2f9e63;--run:#6d9bff;--done:#ff7b72;--pri:#3b6fe0;--warn:#ffa13d;--hd:#262b36;--donebg:#3a2323;--inbg:#15171b;--xbg:#eceef1;--xfg:#1f2228}
*{box-sizing:border-box}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;height:100%;background:#0f1115;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Noto Sans Thai",sans-serif;overflow:hidden}
#view{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#view.edit{cursor:crosshair}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#mlayer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#map{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mk{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mk .dot{min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--idle);border:3px solid #fff;color:#fff;font:600 12px/1 system-ui;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5);white-space:nowrap;font-variant-numeric:tabular-nums}
.mk.run .dot{background:var(--run)}
.mk.warn .dot{background:var(--warn)}
.mk.done .dot{background:var(--done);animation:pulse 1s infinite}
.mk.sel .dot{outline:3px solid #fde047}
.mk .bd{position:absolute;right:-6px;top:-8px;background:#111;color:#fff;border-radius:9px;font:600 10px/1 system-ui;padding:3px 5px;border:1px solid #fff}
.mk.sh .dot{border-radius:9px}
.mk .dn{position:absolute;left:-7px;top:-8px;background:var(--done);color:#fff;border-radius:9px;font:700 10px/1 system-ui;padding:3px 5px;border:1px solid #fff;display:none}
.note{padding:0 12px 12px;color:var(--mut);font-size:12px}
@keyframes pulse{50%{transform:scale(1.18)}}
#top{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--mut)}
button.on{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
input,textarea{background:var(--inbg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;z-index:5;display:none;text-align:center}
#pop{position:absolute;z-index:8;width:min(320px,calc(100vw - 16px));background:var(--card);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:none;overflow:hidden}
#pop .hd{display:flex;gap:8px;align-items:center;padding:10px 10px 8px;background:var(--hd);border-bottom:1px solid var(--line)}
#pop .hd input{flex:1;font-weight:700;font-size:16px;background:transparent;border:none;padding:2px}
#pop .x{border-radius:50%;width:30px;height:30px;padding:0;background:var(--xbg);color:var(--xfg);border:none}
#pop .bd2{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:min(55vh,420px);overflow:auto}
.tr{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tr.run{border-color:var(--run)}.tr.warn{border-color:var(--warn)}.tr.done{border-color:var(--done);background:var(--donebg)}
.tr .r1{display:flex;gap:6px;align-items:center}
.tr .nm{flex:1;min-width:0;font-weight:600;border:none;padding:2px;background:transparent}
.tr .tm{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:86px}
.tr.run .tm{color:var(--run)}.tr.warn .tm{color:var(--warn)}.tr.done .tm{color:var(--done)}
.tr .r2{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.tr .r2 button{padding:5px 10px}
.tr .ti{width:96px;text-align:center;padding:5px;font-weight:600;font-size:15px}
.tr .r3{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.tr .r3 small{font-size:12px;flex-basis:100%}
.tr.pause{border-color:var(--mut)}.tr.pause .tm{color:var(--mut)}
button:disabled{opacity:.4;cursor:default}
.mk.pause .dot{background:#6b7280}
.mk .ps{position:absolute;left:-7px;bottom:-8px;background:#6b7280;color:#fff;border-radius:9px;font:700 10px/1 system-ui;padding:3px 4px;border:1px solid #fff;display:none}
.tr .go{background:var(--pri);border-color:var(--pri);color:#fff}
.tr .del{margin-left:auto;color:var(--mut);padding:5px 8px}
#pop .ft{display:flex;gap:8px;padding:0 10px 10px}
#pop .ft button{flex:1}
#dlg{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:center;justify-content:center;padding:12px}
#dlg .box{background:var(--card);border-radius:14px;padding:14px;width:min(520px,100%);display:flex;flex-direction:column;gap:8px}
#dlg textarea{width:100%;height:200px;font:12px/1.3 ui-monospace,monospace}
#dlg .row{display:flex;gap:8px;flex-wrap:wrap}
#dlg p{margin:0;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="view"><div id="world"><img id="map" alt="map" draggable="false"></div><div id="mlayer"></div></div>
<div id="top">
  <button id="editBtn">✏️ แก้ไขจุด: ปิด</button>
  <button id="themeBtn">🌓 ธีม: สว่าง</button>
  <button id="soundBtn">🔔 เสียง: เปิด</button>
  <button id="notifBtn">🖥️ แจ้งเตือนบนจอ: ปิด</button>
  <button id="fitBtn">⤢ พอดีจอ</button>
  <button id="dataBtn">💾 ข้อมูล</button>
  <button id="imgBtn">🗺️ เปลี่ยนรูปแผนที่</button>
  <input type="file" id="file" accept="image/*" style="display:none">
</div>
<div id="hint"></div>
<div id="pop"></div>
<div id="dlg"><div class="box">
  <b>สำรอง / นำเข้าข้อมูลจุด</b>
  <p>"จุดส่วนตัว" ใช้สำรองหรือส่งให้เพื่อน ส่วน "ทุกจุด" ใช้สร้างไฟล์ points.json เพื่อเป็นจุดส่วนกลางที่ทุกคนเห็น (บันทึกเป็นไฟล์ชื่อ points.json แล้วอัปโหลดไว้ข้าง index.html)</p>
  <div class="row"><button id="dLoc">จุดส่วนตัว</button><button id="dAll">ทุกจุด → points.json</button></div>
  <textarea id="dta" spellcheck="false"></textarea>
  <div class="row"><button id="dCopy">คัดลอก</button><button id="dImp" class="pri">นำเข้า (แทนจุดส่วนตัว)</button><button id="dClose">ปิด</button></div>
  <p id="dMsg"></p>
</div></div>
<script>
(function(){
var KEY="ciment-map-v1", MAPSRC="map.jpg";
var view=document.getElementById("view"), world=document.getElementById("world"), img=document.getElementById("map"), pop=document.getElementById("pop");
var S={s:1,tx:0,ty:0}, W=795, H=761, fitS=1;
var points=[], sound=true, edit=false, selId=null, uid=0, ctx=null;

/* ---------- storage (แยกไว้ เปลี่ยนเป็นออนไลน์ทีหลังได้) ---------- */
var tstate={};
var store={
  load:function(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.points){points=d.points;tstate=d.tstate||{};sound=d.sound!==false;return true}}catch(e){}return false},
  save:function(){try{
    var loc=points.filter(function(p){return !p.shared});
    points.forEach(function(p){if(p.shared)p.timers.forEach(function(t){tstate[t.id]={mins:t.mins,sec:t.sec||0,end:t.end,beeped:t.beeped,pausedLeft:t.pausedLeft||0}})});
    localStorage.setItem(KEY,JSON.stringify({points:loc,tstate:tstate,sound:sound}))}catch(e){}}
};
function nid(){return Date.now().toString(36)+"-"+(uid++)}
function normDur(m,s){var tot=Math.max(0,Math.floor(+m||0))*60+Math.max(0,Math.floor(+s||0));if(tot<1)tot=1;return{mins:Math.floor(tot/60),sec:tot%60}}
function parseDur(o){var tot=Math.max(0,Math.floor(+o.mins||0))*60+Math.max(0,Math.floor(+o.sec||0));if(tot<1)tot=600;return{mins:Math.floor(tot/60),sec:tot%60}}
function dur(t){return (t.mins||0)*60+(t.sec||0)}
function mkTimer(n,m,s){return{id:nid(),name:n,mins:m==null?10:m,sec:s||0,end:0,beeped:false}}
function mkPoint(x,y,n){return{id:nid(),name:n,x:x,y:y,timers:[mkTimer("กองที่ 1",10)]}}
function find(id){for(var i=0;i<points.length;i++)if(points[i].id===id)return points[i]}
function strip(list){return list.map(function(p){return{id:p.id,name:p.name,x:p.x,y:p.y,timers:p.timers.map(function(t){return{id:t.id,name:t.name,mins:t.mins,sec:t.sec||0}})}})}
function buildShared(arr){
  arr=(Array.isArray(arr)?arr:[]).filter(function(p){return p&&p.id&&typeof p.x==="number"&&typeof p.y==="number"&&Array.isArray(p.timers)});
  var ids={};arr.forEach(function(p){ids[String(p.id)]=1});
  var loc=points.filter(function(p){
    if(ids[p.id]){p.timers.forEach(function(t){if(!tstate[t.id]&&t.end)tstate[t.id]={mins:t.mins,sec:t.sec||0,end:t.end,beeped:t.beeped,pausedLeft:t.pausedLeft||0}});return false}
    return true});
  var sh=arr.map(function(p){
    var q={id:String(p.id),name:String(p.name||"กองปูน"),x:p.x,y:p.y,shared:true,timers:[]};
    p.timers.forEach(function(t){var id=String(t.id||nid()),st=tstate[id]||{};
      var d=parseDur(st.mins!==undefined?st:t);q.timers.push({id:id,name:String(t.name||"กอง"),mins:d.mins,sec:d.sec,end:st.end||0,beeped:!!st.beeped,pausedLeft:st.pausedLeft||0})});
    if(!q.timers.length)q.timers.push(mkTimer("กองที่ 1",10));
    return q});
  points=sh.concat(loc);
}

/* ---------- ช่วยเหลือ ---------- */
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);s=s%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function isPaused(t){return !t.end&&(t.pausedLeft||0)>0}
function left(t){return t.end?t.end-Date.now():(isPaused(t)?t.pausedLeft:dur(t)*1000)}
function fmtIn(t){return (t.mins||0)+"."+String(t.sec||0).padStart(2,"0")}
function parseTime(str){
  str=String(str||"").trim().toLowerCase().replace(/\s+/g,"").replace(/,/g,".");
  if(!str)return null;
  var m,tot=null;
  if(m=str.match(/^(\d+)$/))tot=+m[1]*60;
  else if(m=str.match(/^(\d+)[.:](\d+)$/))tot=+m[1]*60+ +m[2];
  else{m=str.match(/^(?:(\d+)(?:นาที|min|m|น))?(?:(\d+)(?:วินาที|วิ|sec|s|ว))?$/);if(m&&(m[1]||m[2]))tot=(+m[1]||0)*60+(+m[2]||0)}
  if(tot===null||tot>86400)return null;
  return tot;
}
function isWarn(t){var l=t.end?t.end-Date.now():0;return t.end&&l>0&&l<=60000}
function isDone(t){return t.end&&t.end-Date.now()<=0}
function beep(){if(!sound)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(function(d){var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.15)})}catch(e){}}
function hint(t){var h=document.getElementById("hint");h.textContent=t;h.style.display=t?"block":"none"}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

/* ---------- แผนที่: pan / zoom ---------- */
function clampView(){
  var vw=view.clientWidth,vh=view.clientHeight,mw=W*S.s,mh=H*S.s;
  S.tx=mw<=vw?(vw-mw)/2:Math.min(0,Math.max(vw-mw,S.tx));
  S.ty=mh<=vh?(vh-mh)/2:Math.min(0,Math.max(vh-mh,S.ty));
}
function apply(){
  clampView();
  world.style.transform="translate("+S.tx+"px,"+S.ty+"px) scale("+S.s+")";
  placeMarkers();
  placePop();
}
function fit(){
  var vw=view.clientWidth,vh=view.clientHeight;if(vw<2||vh<2)return;
  fitS=Math.min(vw/W,vh/H);S.s=fitS;S.tx=(vw-W*S.s)/2;S.ty=(vh-H*S.s)/2;apply();
}
function zoomAt(mx,my,f){
  var ns=Math.min(Math.max(S.s*f,fitS),fitS*10);f=ns/S.s;
  S.tx=mx-(mx-S.tx)*f;S.ty=my-(my-S.ty)*f;S.s=ns;apply();
}
view.addEventListener("wheel",function(e){e.preventDefault();var r=view.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.18:1/1.18)},{passive:false});

var ptrs={},moved=false,startPt=null,lastDist=0;
view.addEventListener("pointerdown",function(e){
  if(e.target.closest(".mk")||e.target.closest("#pop"))return;
  view.setPointerCapture(e.pointerId);
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(ptrs).length===1){moved=false;startPt={x:e.clientX,y:e.clientY}}
  lastDist=0;
});
view.addEventListener("pointermove",function(e){
  var p=ptrs[e.pointerId];if(!p)return;
  if(e.pointerType==="mouse"&&e.buttons===0){reset();return}
  var ids=Object.keys(ptrs);
  if(ids.length===2){
    var a=ptrs[ids[0]],b=ptrs[ids[1]];
    p.x=e.clientX;p.y=e.clientY;
    var d=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastDist){var r=view.getBoundingClientRect();zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/lastDist)}
    lastDist=d;moved=true;return;
  }
  var dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(!moved&&Math.hypot(e.clientX-startPt.x,e.clientY-startPt.y)>5){moved=true;view.classList.add("drag")}
  if(moved){S.tx+=dx;S.ty+=dy;apply()}
  p.x=e.clientX;p.y=e.clientY;
});
function endPtr(e){
  var had=ptrs[e.pointerId];delete ptrs[e.pointerId];view.classList.remove("drag");
  if(!had)return;
  if(!moved&&Object.keys(ptrs).length===0){
    var r=view.getBoundingClientRect();
    var wx=(e.clientX-r.left-S.tx)/S.s,wy=(e.clientY-r.top-S.ty)/S.s;
    if(edit&&wx>=0&&wy>=0&&wx<=W&&wy<=H){
      var p=mkPoint(wx/W,wy/H,"กองปูน "+(points.length+1));points.push(p);store.save();renderMarkers();openPop(p.id);
    }else closePop();
  }
}
function reset(){ptrs={};moved=false;lastDist=0;view.classList.remove("drag")}
view.addEventListener("dragstart",function(e){e.preventDefault()});
view.addEventListener("selectstart",function(e){e.preventDefault()});
view.addEventListener("lostpointercapture",function(e){if(ptrs[e.pointerId])reset()});
window.addEventListener("blur",reset);
window.addEventListener("pointerup",function(e){if(ptrs[e.pointerId]&&!view.hasPointerCapture(e.pointerId))reset()});
view.addEventListener("pointerup",endPtr);
view.addEventListener("pointercancel",endPtr);

/* ---------- จุดบนแผนที่ ---------- */
var mkEls={},mlayer=document.getElementById("mlayer");
function placeMarkers(){
  var k=Math.max(.9,Math.min(1.6,1+.2*Math.log2(S.s/(fitS||1))));
  points.forEach(function(p){var m=mkEls[p.id];if(!m)return;
    m.style.transform="translate("+(S.tx+p.x*W*S.s).toFixed(1)+"px,"+(S.ty+p.y*H*S.s).toFixed(1)+"px) translate(-50%,-50%) scale("+k.toFixed(3)+")"});
}
function renderMarkers(){
  Object.keys(mkEls).forEach(function(k){mkEls[k].remove()});mkEls={};
  points.forEach(function(p){
    var m=el("div","mk");
    m.appendChild(el("div","dot","--:--"));m.appendChild(el("div","bd",""));m.appendChild(el("div","dn","✓"));m.appendChild(el("div","ps","⏸"));
    m.addEventListener("pointerdown",function(e){e.stopPropagation()});
    m.addEventListener("click",function(e){e.stopPropagation();openPop(p.id)});
    mlayer.appendChild(m);mkEls[p.id]=m;
  });
  placeMarkers();tick();
}
function updMarker(p){
  var m=mkEls[p.id];if(!m)return;
  var run=p.timers.filter(function(t){return t.end&&!isDone(t)}),done=p.timers.filter(isDone),warn=run.filter(isWarn),pau=p.timers.filter(isPaused);
  var dot=m.querySelector(".dot"),bd=m.querySelector(".bd"),dn=m.querySelector(".dn"),ps=m.querySelector(".ps");
  var txt;
  if(run.length)txt=fmt(Math.min.apply(null,run.map(left)));
  else if(done.length)txt="ครบ!";
  else if(pau.length)txt="⏸ "+fmt(Math.min.apply(null,pau.map(left)));
  else txt=p.timers.length?fmt(dur(p.timers[0])*1000):"--:--";
  dot.textContent=txt;
  bd.textContent=run.length+"/"+p.timers.length;
  bd.style.display=p.timers.length>1?"block":"none";
  dn.textContent=done.length>1?"✓"+done.length:"✓";
  dn.style.display=(run.length&&done.length)?"block":"none";
  ps.style.display=(pau.length&&(run.length||done.length))?"block":"none";
  m.className="mk"+(run.length?(warn.length?" warn":" run"):(done.length?" done":(pau.length?" pause":"")))+(p.shared?" sh":"")+(selId===p.id?" sel":"");
}

/* ---------- การ์ด popup ---------- */
function openPop(id){selId=id;renderPop();points.forEach(updMarker);placePop()}
function closePop(){selId=null;pop.style.display="none";points.forEach(updMarker)}
function renderPop(){
  var p=find(selId);if(!p){closePop();return}
  pop.innerHTML="";pop.style.display="block";
  var hd=el("div","hd"),nm=el("input");nm.value=p.name;nm.placeholder="ชื่อจุด";
  nm.disabled=!!p.shared;nm.oninput=function(){p.name=nm.value;store.save()};
  var x=el("button","x","✕");x.onclick=closePop;hd.appendChild(nm);hd.appendChild(x);pop.appendChild(hd);
  var body=el("div","bd2");
  p.timers.forEach(function(t){
    var r=el("div","tr");r.dataset.tid=t.id;
    var r1=el("div","r1"),tn=el("input","nm");tn.value=t.name;tn.disabled=!!p.shared;tn.oninput=function(){t.name=tn.value;store.save()};
    var tm=el("div","tm","--:--");r1.appendChild(tn);r1.appendChild(tm);
    var r2=el("div","r2"),go=el("button","go","เริ่ม"),pb=el("button","pb","หยุด"),rs=el("button","","รีเซ็ต"),ti=el("input","ti");
    ti.type="text";ti.value=fmtIn(t);ti.placeholder="กรอกเวลาจร้าา";ti.setAttribute("autocomplete","off");ti.setAttribute("inputmode","text");
    function bad(msg){hint(msg);setTimeout(function(){hint("")},2600);ti.value=fmtIn(t)}
    function commit(startNow){
      var d=parseTime(ti.value);
      if(d===null){bad("รูปแบบเวลาไม่ถูกต้อง ลอง 10 หรือ 10.30 หรือ 1:30 หรือ 90s");return}
      if(d<1){bad("ต้องตั้งเวลาอย่างน้อย 1 วินาที");return}
      var changed=d!==dur(t);
      t.mins=Math.floor(d/60);t.sec=d%60;ti.value=fmtIn(t);
      if(startNow){t.end=Date.now()+d*1000;t.pausedLeft=0;t.beeped=d<=60}
      else if(changed)t.pausedLeft=0;
      store.save();tick();
    }
    ti.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();commit(true)}};
    ti.onchange=function(){commit(false)};
    go.onclick=function(){t.end=Date.now()+dur(t)*1000;t.pausedLeft=0;t.beeped=dur(t)<=60;store.save();tick()};
    pb.onclick=function(){
      if(t.end&&!isDone(t)){t.pausedLeft=Math.max(1,t.end-Date.now());t.end=0}
      else if(isPaused(t)){t.end=Date.now()+t.pausedLeft;t.pausedLeft=0}
      store.save();tick()};
    rs.onclick=function(){t.end=0;t.pausedLeft=0;t.beeped=false;store.save();tick()};
    var del=el("button","del","✕");del.title="ลบตัวนับนี้";
    del.onclick=function(){if(p.timers.length<=1){hint("ต้องมีตัวนับอย่างน้อย 1 ตัว");setTimeout(function(){hint("")},1800);return}
      p.timers=p.timers.filter(function(z){return z!==t});store.save();renderPop();tick();placePop()};
    r2.appendChild(go);r2.appendChild(pb);r2.appendChild(rs);if(!p.shared)r2.appendChild(del);
    var r3=el("div","r3");r3.appendChild(el("span","","เวลา"));r3.appendChild(ti);r3.appendChild(el("span","","นาที.วินาที"));
    r.appendChild(r1);r.appendChild(r2);r.appendChild(r3);body.appendChild(r);
  });
  pop.appendChild(body);
  var ft=el("div","ft"),add=el("button","","+ เพิ่มตัวนับ"),rm=el("button","","ลบจุดนี้");
  add.onclick=function(){var lt=p.timers[p.timers.length-1];p.timers.push(mkTimer("กองที่ "+(p.timers.length+1),lt.mins,lt.sec));store.save();renderPop();tick();placePop()};
  var armed=false;
  rm.onclick=function(){if(!armed){armed=true;rm.textContent="กดอีกครั้งเพื่อลบ";rm.style.color="#b42318";setTimeout(function(){armed=false;rm.textContent="ลบจุดนี้";rm.style.color=""},2500);return}
    points=points.filter(function(z){return z!==p});store.save();closePop();renderMarkers()};
  if(p.shared){pop.appendChild(el("div","note","จุดส่วนกลาง: แก้ชื่อหรือลบไม่ได้ แต่ปรับเวลาและกดนับเวลาได้"))}else{ft.appendChild(add);ft.appendChild(rm);pop.appendChild(ft)}
  tick();
}
function placePop(){
  if(!selId||pop.style.display==="none")return;
  var p=find(selId);if(!p)return;
  var sx=S.tx+p.x*W*S.s,sy=S.ty+p.y*H*S.s,w=pop.offsetWidth,h=pop.offsetHeight,vw=view.clientWidth,vh=view.clientHeight;
  var l=Math.min(Math.max(sx-w/2,8),Math.max(8,vw-w-8));
  var t=sy-h-26;if(t<52)t=sy+26;
  t=Math.min(Math.max(t,52),Math.max(52,vh-h-8));
  pop.style.left=l+"px";pop.style.top=t+"px";
}

/* ---------- นาฬิกา ---------- */
function tick(){
  points.forEach(function(p){
    p.timers.forEach(function(t){if(t.end&&!t.beeped){var l=t.end-Date.now();
      if(l<=0){t.beeped=true;store.save()}
      else if(l<=60000){t.beeped=true;store.save();beep();notify(p,t);hint("เหลือ 1 นาที: "+p.name+" / "+t.name);setTimeout(function(){hint("")},3500)}}});
    updMarker(p);
  });
  if(selId){
    var p=find(selId);if(!p)return;
    p.timers.forEach(function(t){
      var r=pop.querySelector('.tr[data-tid="'+t.id+'"]');if(!r)return;
      var d=isDone(t);var pz=isPaused(t);r.className="tr"+(d?" done":isWarn(t)?" warn":t.end?" run":pz?" pause":"");
      r.querySelector(".tm").textContent=d?"ครบแล้ว!":fmt(left(t))+(pz?" ⏸":"");
      r.querySelector(".go").textContent=t.end?"เริ่มใหม่":"เริ่ม";var pbb=r.querySelector(".pb");pbb.textContent=pz?"ต่อ":"หยุด";pbb.disabled=!(pz||(t.end&&!d));
    });
  }
}
setInterval(tick,500);

/* ---------- ปุ่มด้านบน ---------- */
var themeBtn=document.getElementById("themeBtn"),theme="light",TKEY="ciment-map-theme";
try{var tv=localStorage.getItem(TKEY);if(tv==="dark"||tv==="light")theme=tv}catch(e){}
function applyTheme(){document.documentElement.setAttribute("data-theme",theme);themeBtn.textContent="🌓 ธีม: "+(theme==="dark"?"มืด":"สว่าง")}
themeBtn.onclick=function(){theme=theme==="dark"?"light":"dark";try{localStorage.setItem(TKEY,theme)}catch(e){}applyTheme()};
applyTheme();
var editBtn=document.getElementById("editBtn"),soundBtn=document.getElementById("soundBtn"),notifBtn=document.getElementById("notifBtn"),NKEY="ciment-map-notif",notif=false;
try{notif=localStorage.getItem(NKEY)==="1"&&("Notification" in window)&&Notification.permission==="granted"}catch(e){}
function notify(p,t,title){
  if(!notif)return;
  try{if(Notification.permission==="granted")new Notification(title||"เหลือ 1 นาที",{body:p.name+" / "+t.name,tag:"t-"+t.id})}catch(e){}
}
notifBtn.onclick=function(){
  if(notif){notif=false;try{localStorage.setItem(NKEY,"0")}catch(e){}labels();return}
  var fired=false;function ok(){if(fired)return;fired=true;notif=true;try{localStorage.setItem(NKEY,"1")}catch(e){}labels();notify({name:"แผนที่กองปูน"},{id:"test",name:"จะแจ้งเตือนตอนเหลือ 1 นาที"},"เปิดการแจ้งเตือนแล้ว")}
  function msg(t){hint(t);setTimeout(function(){hint("")},4500)}
  if(!("Notification" in window)){msg("เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือนบนจอ");return}
  if(Notification.permission==="granted"){ok();return}
  if(Notification.permission==="denied"){msg("การแจ้งเตือนถูกบล็อกไว้ กดไอคอนกุญแจข้างช่องที่อยู่เว็บ แล้วอนุญาตการแจ้งเตือน");return}
  try{var r=Notification.requestPermission(function(x){if(x==="granted")ok();else msg("ไม่ได้รับอนุญาตให้แจ้งเตือน")});
    if(r&&r.then)r.then(function(x){if(x==="granted")ok();else msg("ไม่ได้รับอนุญาตให้แจ้งเตือน")})}catch(e){msg("เปิดการแจ้งเตือนไม่ได้ในหน้านี้")}
};
function labels(){editBtn.textContent="✏️ แก้ไขจุด: "+(edit?"เปิด (คลิกแผนที่เพื่อวางจุด)":"ปิด");editBtn.className=edit?"on":"";
  soundBtn.textContent="🔔 เสียง: "+(sound?"เปิด":"ปิด");notifBtn.textContent="🖥️ แจ้งเตือนบนจอ: "+(notif?"เปิด":"ปิด");notifBtn.className=notif?"on":"";view.classList.toggle("edit",edit)}
editBtn.onclick=function(){edit=!edit;labels()};
soundBtn.onclick=function(){sound=!sound;labels();store.save();if(sound)beep()};
document.getElementById("fitBtn").onclick=fit;
var file=document.getElementById("file");
document.getElementById("imgBtn").onclick=function(){file.click()};
file.onchange=function(){var f=file.files&&file.files[0];if(!f)return;img.src=URL.createObjectURL(f);hint("ใช้รูปนี้ชั่วคราวเท่านั้น ถ้าจะใช้ถาวรให้ตั้งชื่อไฟล์ว่า map.jpg ไว้ข้าง index.html");setTimeout(function(){hint("")},5000)};

var dlg=document.getElementById("dlg"),dta=document.getElementById("dta"),dMsg=document.getElementById("dMsg");
function showData(list,msg){dta.value=JSON.stringify(strip(list),null,1);dMsg.textContent=msg;dlg.style.display="flex"}
document.getElementById("dataBtn").onclick=function(){showData(points.filter(function(p){return !p.shared}),"จุดส่วนตัวของคุณ")};
document.getElementById("dLoc").onclick=function(){showData(points.filter(function(p){return !p.shared}),"จุดส่วนตัวของคุณ")};
document.getElementById("dAll").onclick=function(){showData(points,"ทุกจุด: คัดลอกไปบันทึกเป็นไฟล์ points.json")};
document.getElementById("dClose").onclick=function(){dlg.style.display="none"};
document.getElementById("dCopy").onclick=function(){dta.select();try{navigator.clipboard.writeText(dta.value).then(function(){dMsg.textContent="คัดลอกแล้ว"},function(){dMsg.textContent="คัดลอกไม่ได้ ลองกด Ctrl+C เอง"})}catch(e){dMsg.textContent="คัดลอกไม่ได้ ลองกด Ctrl+C เอง"}};
document.getElementById("dImp").onclick=function(){
  try{var d=JSON.parse(dta.value);if(!Array.isArray(d))throw 0;
    d.forEach(function(p){if(typeof p.x!=="number"||typeof p.y!=="number"||!Array.isArray(p.timers))throw 0});
    var sid={};points.forEach(function(p){if(p.shared)sid[p.id]=1});
    d=d.filter(function(p){return !sid[p.id]}).map(function(p){
      return{id:String(p.id||nid()),name:String(p.name||"กองปูน"),x:p.x,y:p.y,shared:false,
        timers:p.timers.map(function(t){return{id:String(t.id||nid()),name:String(t.name||"กอง"),mins:parseDur(t).mins,sec:parseDur(t).sec,end:0,beeped:false}})}});
    points=points.filter(function(p){return p.shared}).concat(d);store.save();closePop();renderMarkers();dMsg.textContent="นำเข้าแล้ว "+d.length+" จุด (ข้ามจุดที่ซ้ำกับจุดส่วนกลาง)";
  }catch(e){dMsg.textContent="ข้อมูลไม่ถูกต้อง"}
};

/* ---------- เริ่มต้น ---------- */
function init(){
  W=img.naturalWidth||W;H=img.naturalHeight||H;
  world.style.width=W+"px";world.style.height=H+"px";
  fit();renderMarkers();
}
img.onload=init;
function relayout(){
  var vw=view.clientWidth,vh=view.clientHeight;if(vw<2||vh<2)return;
  var was=Math.abs(S.s-fitS)<1e-6,nf=Math.min(vw/W,vh/H);
  if(was||S.s<nf)fit();else{fitS=nf;apply()}
}
window.addEventListener("resize",relayout);
if(window.ResizeObserver)new ResizeObserver(relayout).observe(view);
var hadStore=store.load();
fetch("points.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():[]}).catch(function(){return[]}).then(function(arr){
  buildShared(arr);
  if(!hadStore&&!points.length){
    points=[mkPoint(.52,.5,"กองปูน ตัวอย่าง 1"),mkPoint(.3,.42,"กองปูน ตัวอย่าง 2"),mkPoint(.66,.62,"กองปูน ตัวอย่าง 3")];
    points[0].timers.push(mkTimer("กองที่ 2",15));
  }
  store.save();labels();img.src=MAPSRC;
});
})();
</script>
